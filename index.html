<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visual Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="header-left">
    <input
      id="search"
      placeholder="Search (e.g. day, night, interior, exterior, closeup)…"
    />
  </div>
  <div class="header-right">
    <button id="grid-toggle">Large Grid</button>
  </div>
</header>

<div id="layout">
  <aside id="filters">
    <div class="filters-header">
      <h3>Folders</h3>
      <button id="clear-filters">Clear</button>
    </div>
    <div id="folder-filters"></div>

    <hr />

    <div class="bucket-section">
      <h3 id="bucket-count">Bucket (0)</h3>
      <button id="view-bucket">View Bucket</button>
      <button id="clear-bucket">Clear Bucket</button>
    </div>
  </aside>

  <section id="grid"></section>
</div>

<script src="app.js"></script>
</body>
</html>
